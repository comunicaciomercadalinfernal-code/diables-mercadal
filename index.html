<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diables del Mercadal Infernal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--red:#b3261e;--red-d:#7f1a14;--bg:#faf7f5;--card:#fff;--txt:#222;--muted:#666;--line:#e3dcd8}
@media (prefers-color-scheme: dark){:root{--bg:#1b1718;--card:#262021;--txt:#f2ecea;--muted:#aaa;--line:#3d3436}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--red);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:clamp(44px,9vw,64px);width:auto;display:block;filter:brightness(0) invert(1)}
.brand h1{font-size:1.15rem;margin:0}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid #fff8;color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on{background:#fff;color:var(--red-d);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:18px;overflow-x:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.ev{border-left:4px solid var(--red)}
h2{margin:0 0 12px;font-size:1.05rem;color:var(--red)}
h3{margin:14px 0 6px;font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ev h3{color:var(--txt);text-transform:none;font-size:1.05rem;margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=url],select{width:100%;padding:8px;margin-top:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--txt);font:inherit}
input[type=file]{margin-top:3px;font:inherit;color:var(--txt)}
.chk{display:flex;align-items:center;gap:6px;font-size:.92rem;color:var(--txt);margin:4px 0}
.chk input{width:18px;height:18px;accent-color:var(--red)}
.checks{display:flex;flex-wrap:wrap;gap:4px 16px}
button.primary{background:var(--red);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600;min-height:40px}
button.ghost{background:transparent;color:var(--red);border:1px solid var(--red);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit;min-height:36px}
button.danger{color:#b3261e;border-color:#b3261e}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rsvp{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.8rem}
.tag{display:inline-block;background:var(--line);border-radius:999px;padding:2px 8px;font-size:.75rem;margin:2px 2px 2px 0}
.tag.r{background:var(--red);color:#fff}
.muted{color:var(--muted);font-size:.88rem}
.msg{color:var(--red);font-size:.9rem;margin-top:8px}
.stat{text-align:center;padding:10px}
.stat b{display:block;font-size:1.4rem;color:var(--red)}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;vertical-align:middle;background:var(--line);display:inline-block}
a{color:var(--red)}
.hidden{display:none!important}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px!important}
.pw-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;cursor:pointer;padding:6px;color:var(--muted);line-height:0}
.pw-btn svg{width:20px;height:20px}
@media (max-width:600px){main{padding:12px}.card{padding:12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="DMI_Logo_Blanc.png" alt="Diables del Mercadal Infernal" onerror="this.style.display='none'">
    <h1>Diables del Mercadal Infernal</h1>
  </div>
  <nav>
    <button id="t-e" class="on" onclick="go('e')">Esdeveniments</button>
    <button id="t-c" onclick="go('c')">Compte</button>
    <button id="t-m" class="hidden" onclick="go('m')">Membres</button>
  </nav>
</header>

<main>
<!-- ============ ESDEVENIMENTS ============ -->
<section id="s-e">
  <div id="ev-admin" class="card hidden">
    <h2 id="ev-title">Nou esdeveniment</h2>
    <form id="ev-form" onsubmit="saveEv(event)">
      <div class="grid">
        <div style="grid-column:1/-1"><label>Nom de l'acte *</label><input type="text" name="nom" required></div>
        <div><label>Lloc de quedada</label><input type="text" name="quedada"></div>
        <div><label>Enllaç al lloc de quedada</label><input type="url" name="quedada_url" placeholder="https://…"></div>
        <div><label>Lloc</label><input type="text" name="lloc"></div>
        <div><label>Enllaç al lloc</label><input type="url" name="lloc_url" placeholder="https://…"></div>
